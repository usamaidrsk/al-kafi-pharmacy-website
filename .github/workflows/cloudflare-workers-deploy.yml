name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SITE_URL: https://alkaafipharmacy.com
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      WRANGLER_WRITE_LOGS: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node -v && npm -v
      - name: Normalize Cloudflare CI secrets
        run: |
          node <<'NODE'
            const fs = require("node:fs");
            const required = ["CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN"];
            const normalized = {};
            let failed = false;

            for (const key of required) {
              const value = process.env[key] || "";
              const compact = value.replace(/\s+/g, "");

              if (!compact) {
                console.error(`::error::${key} is missing from GitHub Actions secrets.`);
                failed = true;
                continue;
              }

              normalized[key] = compact;

              if (value !== compact) {
                console.warn(`::warning::${key} contained whitespace/newlines and was normalized for this CI run. Recreate the GitHub secret as a clean single-line value when possible.`);
              }
            }

            if ((normalized.CLOUDFLARE_API_TOKEN || "").startsWith("Bearer")) {
              console.error("::error::CLOUDFLARE_API_TOKEN must be the raw token only, without the Bearer prefix.");
              failed = true;
            }

            if (failed) process.exit(1);

            for (const [key, value] of Object.entries(normalized)) {
              fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
            }
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm run deploy:worker
