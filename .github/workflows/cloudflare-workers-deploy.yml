name: Deploy to Cloudflare Workers

on:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build_and_deploy:
    runs-on: ubuntu-latest
    env:
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      NEXT_PUBLIC_SITE_URL: https://alkaafipharmacy.com
      NEXT_PUBLIC_TURNSTILE_SITE_KEY: ${{ vars.NEXT_PUBLIC_TURNSTILE_SITE_KEY }}
      WRANGLER_WRITE_LOGS: false
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: node -v && npm -v
      - name: Normalize Cloudflare CI secrets
        run: |
          node <<'NODE'
            const fs = require("node:fs");
            const required = ["CLOUDFLARE_ACCOUNT_ID", "CLOUDFLARE_API_TOKEN"];
            const normalized = {};
            let failed = false;

            function normalizeSecret(key, value) {
              let compact = value.trim();
              if (compact.startsWith(`${key}=`)) {
                compact = compact.slice(`${key}=`.length).trim();
              }
              if (
                (compact.startsWith("\"") && compact.endsWith("\"")) ||
                (compact.startsWith("'") && compact.endsWith("'"))
              ) {
                compact = compact.slice(1, -1).trim();
              }
              return compact.replace(/\s+/g, "");
            }

            for (const key of required) {
              const value = process.env[key] || "";
              const compact = normalizeSecret(key, value);

              if (!compact) {
                console.error(`::error::${key} is missing from GitHub Actions secrets.`);
                failed = true;
                continue;
              }

              normalized[key] = compact;

              if (value !== compact) {
                console.warn(`::warning::${key} contained extra formatting and was normalized for this CI run. Recreate the GitHub secret as a clean single-line value when possible.`);
              }
            }

            if ((normalized.CLOUDFLARE_API_TOKEN || "").startsWith("Bearer")) {
              console.error("::error::CLOUDFLARE_API_TOKEN must be the raw token only, without the Bearer prefix.");
              failed = true;
            }

            if (failed) process.exit(1);

            for (const [key, value] of Object.entries(normalized)) {
              fs.appendFileSync(process.env.GITHUB_ENV, `${key}=${value}\n`);
            }
          NODE
      - name: Verify Cloudflare API token
        run: |
          node <<'NODE'
            const token = process.env.CLOUDFLARE_API_TOKEN || "";

            try {
              const response = await fetch("https://api.cloudflare.com/client/v4/user/tokens/verify", {
                headers: {
                  Authorization: `Bearer ${token}`,
                  "Content-Type": "application/json",
                },
              });
              const body = await response.json().catch(() => ({}));

              if (!response.ok || body.success !== true) {
                const errors = Array.isArray(body.errors)
                  ? body.errors.map((error) => `${error.code || "unknown"}: ${error.message || "Unknown error"}`).join("; ")
                  : "Cloudflare did not return a valid token verification response.";
                console.error(`::error::CLOUDFLARE_API_TOKEN failed Cloudflare verification. Recreate the GitHub secret with the raw API token only. Details: ${errors}`);
                process.exit(1);
              }

              console.log("Cloudflare API token verified.");
            } catch (error) {
              console.error(`::error::Could not verify CLOUDFLARE_API_TOKEN. Recreate it as the raw API token only. ${error instanceof Error ? error.message : String(error)}`);
              process.exit(1);
            }
          NODE
      - name: Verify Cloudflare zone and DNS access
        run: |
          node <<'NODE'
            const accountId = process.env.CLOUDFLARE_ACCOUNT_ID || "";
            const token = process.env.CLOUDFLARE_API_TOKEN || "";
            const zoneName = "alkaafipharmacy.com";
            const headers = {
              Authorization: `Bearer ${token}`,
              "Content-Type": "application/json",
            };

            async function cloudflare(path) {
              const response = await fetch(`https://api.cloudflare.com/client/v4${path}`, { headers });
              const body = await response.json().catch(() => ({}));
              if (!response.ok || body.success !== true) {
                const errors = Array.isArray(body.errors)
                  ? body.errors.map((error) => `${error.code || "unknown"}: ${error.message || "Unknown error"}`).join("; ")
                  : "Cloudflare did not return a normal API response.";
                throw new Error(errors);
              }
              return body.result;
            }

            try {
              const zones = await cloudflare(`/zones?name=${zoneName}&account.id=${accountId}`);
              if (!Array.isArray(zones) || zones.length !== 1) {
                console.error(`::error::Could not find active zone ${zoneName} in the Cloudflare account used by CLOUDFLARE_ACCOUNT_ID. Confirm the account ID and token account resource.`);
                process.exit(1);
              }

              const zoneId = zones[0].id;
              await cloudflare(`/zones/${zoneId}/dns_records?per_page=1`);
              console.log(`Cloudflare zone and DNS access verified for ${zoneName}.`);
            } catch (error) {
              console.error(`::error::Cloudflare token cannot read the zone/DNS records needed to attach Worker custom domains. Add Zone > Zone > Read and Zone > DNS > Edit for ${zoneName}. Details: ${error instanceof Error ? error.message : String(error)}`);
              process.exit(1);
            }
          NODE
      - run: npm ci
      - run: npm run build
      - run: npm run db:remote
      - run: npm run deploy:worker
